
apiVersion: apps/v1
kind: Deployment
metadata:
  name: k8s-cicd-demo
  namespace: dev
spec:
  replicas: 2
  selector:
    matchLabels:
      app: k8s-cicd-demo
  template:
    metadata:
      labels:
        app: k8s-cicd-demo
    spec:
      containers:
        - name: web
          image: vasimnjamadar/k8s-cicd-demo:17
          ports:
            - containerPort: 80

